# Optimiza Conversacional
#
#   docker compose up --build              → almacén + carga + app (camino Redshift completo)
#   docker compose --profile demo up       → solo la app, con datos de demostración en DuckDB
#
# El servicio `warehouse` es PostgreSQL, compatible con el protocolo de Redshift:
# la aplicación se conecta con psycopg2 y un usuario de solo lectura, exactamente
# igual que contra un cluster real. Para apuntar a Redshift de verdad basta con
# cambiar REDSHIFT_HOST/PORT/DB/USER/PASSWORD en .env (ver infra/ para crear el cluster).

services:
  # ---------------- Almacén analítico (stand-in local de Redshift) ----------------
  warehouse:
    image: postgres:16-alpine
    container_name: optimiza-warehouse
    environment:
      POSTGRES_USER: "${WAREHOUSE_ADMIN_USER:-optimiza_admin}"
      POSTGRES_PASSWORD: "${WAREHOUSE_ADMIN_PASSWORD:-optimiza_admin_pwd}"
      POSTGRES_DB: "${WAREHOUSE_DB:-analytics}"
    command: >
      postgres -c shared_buffers=256MB -c work_mem=32MB
               -c max_connections=50 -c log_min_duration_statement=2000
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./docker/warehouse:/docker-entrypoint-initdb.d:ro
    ports:
      - "${WAREHOUSE_PORT_HOST:-5439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_ADMIN_USER:-optimiza_admin} -d ${WAREHOUSE_DB:-analytics}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------------- Carga de datos en el almacén (una sola vez) ----------------
  warehouse-loader:
    build:
      context: .
      dockerfile: Dockerfile
    image: optimiza-conversacional:latest
    container_name: optimiza-loader
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: "${WAREHOUSE_DB:-analytics}"
      WAREHOUSE_ADMIN_USER: "${WAREHOUSE_ADMIN_USER:-optimiza_admin}"
      WAREHOUSE_ADMIN_PASSWORD: "${WAREHOUSE_ADMIN_PASSWORD:-optimiza_admin_pwd}"
      REDSHIFT_SCHEMA: "${REDSHIFT_SCHEMA:-analytics}"
      REDSHIFT_USER: "${REDSHIFT_USER:-optimiza_ro}"
      OPTIMIZA_DATA_DIR: /app/data
    volumes:
      - optimiza-data:/app/data
    command: python -m backend.app.pipeline.warehouse_loader
    restart: "no"

  # ---------------- Aplicación (API + frontend) ----------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: optimiza-conversacional:latest
    container_name: optimiza-app
    depends_on:
      warehouse:
        condition: service_healthy
      warehouse-loader:
        condition: service_completed_successfully
    ports:
      - "${OPTIMIZA_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OPTIMIZA_SOURCE_MODE: "${OPTIMIZA_SOURCE_MODE:-redshift}"
      OPTIMIZA_DATA_DIR: /app/data
      REDSHIFT_HOST: "${REDSHIFT_HOST:-warehouse}"
      REDSHIFT_PORT: "${REDSHIFT_PORT:-5432}"
      REDSHIFT_DB: "${REDSHIFT_DB:-analytics}"
      REDSHIFT_USER: "${REDSHIFT_USER:-optimiza_ro}"
      REDSHIFT_PASSWORD: "${REDSHIFT_PASSWORD:-optimiza_ro_pwd}"
      REDSHIFT_SCHEMA: "${REDSHIFT_SCHEMA:-analytics}"
      REDSHIFT_STATEMENT_TIMEOUT_MS: "${REDSHIFT_STATEMENT_TIMEOUT_MS:-15000}"
      QUERY_ROUTING: "${QUERY_ROUTING:-auto}"
      CACHE_MAX_AGE_MIN: "${CACHE_MAX_AGE_MIN:-720}"
      SYNC_ON_START: "${SYNC_ON_START:-true}"
      MAX_ROWS: "${MAX_ROWS:-5000}"
      QUERY_TIMEOUT_S: "${QUERY_TIMEOUT_S:-15}"
      MASK_PII: "${MASK_PII:-true}"
      INTENT_ENGINES: "${INTENT_ENGINES:-edge,reglas}"
      INTENT_MIN_CONFIDENCE: "${INTENT_MIN_CONFIDENCE:-0.35}"
      EDGE_CLASSIFIER_BACKEND: "${EDGE_CLASSIFIER_BACKEND:-edge}"
      EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-hashing}"
      VECTOR_BACKEND: "${VECTOR_BACKEND:-memory}"
      QDRANT_URL: "${QDRANT_URL:-http://qdrant:6333}"
      LLM_PROVIDER: "${LLM_PROVIDER:-none}"
      CURRENCY_SYMBOL: "${CURRENCY_SYMBOL:-S/}"
      # Canal de WhatsApp (perfil whatsapp). Los números autorizados son la
      # única puerta de entrada: sin lista, el canal no responde a nadie.
      WHATSAPP_ENABLED: "${WHATSAPP_ENABLED:-false}"
      EVOLUTION_URL: "${EVOLUTION_URL:-http://evolution-api:8080}"
      EVOLUTION_API_KEY: "${EVOLUTION_API_KEY:-optimiza-evolution-key}"
      EVOLUTION_INSTANCE: "${EVOLUTION_INSTANCE:-optimiza}"
      WHATSAPP_AUTORIZADOS: "${WHATSAPP_AUTORIZADOS:-}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
    volumes:
      - optimiza-data:/app/data
      # El frontend se monta desde el repo: editarlo no requiere reconstruir la imagen
      - ./frontend/static:/app/frontend/static:ro
    restart: unless-stopped

  # ---------------- Solo demo, sin almacén: docker compose --profile demo up ----------------
  app-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: optimiza-conversacional:latest
    container_name: optimiza-app-demo
    profiles: ["demo"]
    ports:
      - "${OPTIMIZA_PORT:-8000}:8000"
    environment:
      OPTIMIZA_SOURCE_MODE: demo
      OPTIMIZA_DATA_DIR: /app/data
      SYNC_ON_START: "false"
    volumes:
      - optimiza-demo-data:/app/data
      - ./frontend/static:/app/frontend/static:ro
    restart: unless-stopped

  # ---------------- Canal de WhatsApp: docker compose --profile whatsapp up -d ----------------
  # Evolution API expone WhatsApp como API HTTP. La aplicación le habla por REST
  # y recibe los mensajes entrantes en /api/canales/whatsapp/webhook.
  evolution-api:
    # Imagen oficial de Evolution API v2. Para fijar versión, cambia `latest`
    # por una etiqueta concreta (por ejemplo v2.2.3) en EVOLUTION_IMAGE.
    image: "${EVOLUTION_IMAGE:-evoapicloud/evolution-api:latest}"
    container_name: optimiza-evolution
    profiles: ["whatsapp"]
    depends_on:
      evolution-db:
        condition: service_healthy
      evolution-cache:
        condition: service_started
    ports:
      - "${EVOLUTION_PORT:-8089}:8080"
    environment:
      SERVER_PORT: "8080"
      SERVER_URL: "${EVOLUTION_SERVER_URL:-http://localhost:8089}"
      AUTHENTICATION_API_KEY: "${EVOLUTION_API_KEY:-optimiza-evolution-key}"
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: "postgresql://evolution:evolution_pwd@evolution-db:5432/evolution?schema=public"
      DATABASE_CONNECTION_CLIENT_NAME: optimiza
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-cache:6379/6
      CACHE_REDIS_PREFIX_KEY: optimiza
      CACHE_LOCAL_ENABLED: "false"
      # La aplicación recibe los mensajes aquí. Dentro de la red de compose el
      # nombre del servicio `app` resuelve solo.
      WEBHOOK_GLOBAL_ENABLED: "${EVOLUTION_WEBHOOK_GLOBAL:-false}"
      WEBHOOK_GLOBAL_URL: "${EVOLUTION_WEBHOOK_URL:-http://app:8000/api/canales/whatsapp/webhook}"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      QRCODE_LIMIT: "10"
      LOG_LEVEL: "${EVOLUTION_LOG_LEVEL:-ERROR}"
      LOG_BAILEYS: error
      DEL_INSTANCE: "false"
      LANGUAGE: es
    volumes:
      - evolution-instances:/evolution/instances
    restart: unless-stopped

  evolution-db:
    image: postgres:16-alpine
    container_name: optimiza-evolution-db
    profiles: ["whatsapp"]
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_pwd
      POSTGRES_DB: evolution
    volumes:
      - evolution-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  evolution-cache:
    image: redis:7-alpine
    container_name: optimiza-evolution-cache
    profiles: ["whatsapp"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - evolution-cache-data:/data
    restart: unless-stopped

  # ---------------- Vector DB opcional: docker compose --profile qdrant up ----------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: optimiza-qdrant
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  # ---------------- Navegador para las pruebas unitarias del frontend ----------------
  # docker compose --profile test up -d lightpanda
  lightpanda:
    image: lightpanda/browser:nightly
    container_name: optimiza-lightpanda
    profiles: ["test"]
    # El entrypoint de la imagen es tini, así que el comando incluye el binario
    # --advertise-host: Lightpanda valida el header Host del WebSocket; con
    # --host 0.0.0.0 hay que anunciar el nombre con el que lo llaman los demás.
    command: ["/bin/lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222",
              "--advertise-host", "${LIGHTPANDA_ADVERTISE_HOST:-lightpanda}", "--log-level", "error"]
    # La imagen no trae curl ni wget para un healthcheck; el runner espera al
    # servidor CDP por su cuenta antes de conectarse.
    ports:
      - "${LIGHTPANDA_PORT:-9222}:9222"

  # ---------------- Pruebas unitarias del frontend sobre Lightpanda ----------------
  # docker compose --profile test run --rm unit-web
  unit-web:
    image: node:22-alpine
    container_name: optimiza-unit-web
    profiles: ["test"]
    depends_on:
      - lightpanda
    working_dir: /app
    environment:
      LIGHTPANDA_WS: ws://lightpanda:9222
      # Escucha en todas las interfaces: Lightpanda corre en otro contenedor y
      # necesita alcanzar este servidor. La dirección anunciada se calcula sola.
      TEST_BIND: 0.0.0.0
      NO_COLOR: "1"
    volumes:
      - .:/app
    command: sh -c "npm install --silent --no-audit --no-fund --omit=optional puppeteer-core && node tests/unit-web/runner.mjs"

  # ---------------- Pruebas: docker compose --profile test run --rm tests ----------------
  tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: optimiza-conversacional:latest
    profiles: ["test"]
    environment:
      OPTIMIZA_DATA_DIR: /app/data-tests
      OPTIMIZA_SOURCE_MODE: demo
      SYNC_ON_START: "false"
    command: sh -c "pip install -q -r requirements-dev.txt && pytest -q"

volumes:
  evolution-instances:
  evolution-db-data:
  evolution-cache-data:
  optimiza-data:
  optimiza-demo-data:
  warehouse-data:
  qdrant-data:
