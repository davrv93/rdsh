<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1020" width="1280" height="1020" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title>Arquitectura de Optimiza Conversacional</title>
  <desc>Flujo de una pregunta: navegador, agente (clasificador, retriever, generador SQL, validador), ruteo, datos (almacén analítico y DuckDB), post-proceso y respuesta.</desc>

  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#767d8a"/>
    </marker>
    <marker id="flechaVerde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f8a5f"/>
    </marker>
    <marker id="flechaNaranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <style>
      .t     { fill: #16191f; font-size: 13px; font-weight: 600; }
      .s     { fill: #767d8a; font-size: 11px; }
      .grupo { fill: #767d8a; font-size: 11px; font-weight: 600; letter-spacing: .6px; }
      .num   { fill: #2563eb; font-size: 11px; font-weight: 600; }
      .edge  { stroke: #9aa1ad; stroke-width: 1.4; fill: none; marker-end: url(#flecha); }
      .edgeV { stroke: #0f8a5f; stroke-width: 1.6; fill: none; marker-end: url(#flechaVerde); }
      .edgeN { stroke: #b45309; stroke-width: 1.6; fill: none; marker-end: url(#flechaNaranja); }
      .lbl   { fill: #767d8a; font-size: 10.5px; }
    </style>
  </defs>

  <rect width="1280" height="1020" fill="#ffffff"/>

  <!-- Encabezado -->
  <text x="40" y="46" fill="#16191f" font-size="21" font-weight="600">Optimiza Conversacional — arquitectura</text>
  <text x="40" y="70" class="s">Pregunta en español sobre el almacén analítico, resuelta en milisegundos. Tiempos medidos con la copia materializada vigente.</text>

  <!-- ============ Navegador ============ -->
  <rect x="160" y="96" width="960" height="64" rx="10" fill="#f7f8fa" stroke="#e6e8ec"/>
  <text x="180" y="120" class="grupo">NAVEGADOR</text>
  <text x="180" y="142" class="t">Chat de una columna <tspan class="s">· vista ejecutiva y modo experto</tspan></text>
  <text x="820" y="142" class="t">Configuración <tspan class="s">· metadata, relaciones, materialización</tspan></text>

  <path class="edge" d="M 640 160 L 640 190"/>
  <text x="652" y="180" class="lbl">POST /api/preguntar</text>

  <!-- ============ Agente ============ -->
  <rect x="80" y="196" width="1120" height="120" rx="12" fill="#ffffff" stroke="#c9d8fb"/>
  <text x="96" y="214" class="grupo">AGENTE · PASOS 1 A 4</text>

  <g>
    <rect x="96" y="224" width="254" height="76" rx="9" fill="#eff4ff" stroke="#2563eb"/>
    <text x="110" y="246" class="num">1</text>
    <text x="126" y="246" class="t">Clasificador edge</text>
    <text x="110" y="264" class="s">7 intenciones en español</text>
    <text x="110" y="280" class="s">CPU, sin red · 0.06–0.2 ms</text>
  </g>
  <g>
    <rect x="374" y="224" width="254" height="76" rx="9" fill="#eff4ff" stroke="#2563eb"/>
    <text x="388" y="246" class="num">2</text>
    <text x="404" y="246" class="t">Retriever vectorial</text>
    <text x="388" y="264" class="s">128 documentos: tablas,</text>
    <text x="388" y="280" class="s">columnas, KPIs, relaciones</text>
  </g>
  <g>
    <rect x="652" y="224" width="254" height="76" rx="9" fill="#eff4ff" stroke="#2563eb"/>
    <text x="666" y="246" class="num">3</text>
    <text x="682" y="246" class="t">Generador SQL</text>
    <text x="666" y="264" class="s">determinista, sin costo</text>
    <text x="666" y="280" class="s">LLM opcional: solo metadatos</text>
  </g>
  <g>
    <rect x="930" y="224" width="254" height="76" rx="9" fill="#eff4ff" stroke="#2563eb"/>
    <text x="944" y="246" class="num">4</text>
    <text x="960" y="246" class="t">Validador</text>
    <text x="944" y="264" class="s">solo SELECT · catálogo</text>
    <text x="944" y="280" class="s">LIMIT · riesgo de escaneo</text>
  </g>

  <path class="edge" d="M 350 262 L 368 262"/>
  <path class="edge" d="M 628 262 L 646 262"/>
  <path class="edge" d="M 906 262 L 924 262"/>

  <path class="edge" d="M 640 316 L 640 352"/>

  <!-- ============ Ruteo ============ -->
  <polygon points="640,356 760,396 640,436 520,396" fill="#f7f8fa" stroke="#9aa1ad"/>
  <text x="640" y="392" class="num" text-anchor="middle">5</text>
  <text x="640" y="410" class="t" text-anchor="middle">¿Dónde ejecuto?</text>

  <path class="edge" d="M 520 396 L 340 466"/>
  <text x="352" y="440" class="lbl">copia vencida o ausente</text>
  <path class="edgeV" d="M 760 396 L 940 466"/>
  <text x="800" y="440" class="lbl">copia vigente</text>

  <!-- ============ Datos ============ -->
  <rect x="80" y="470" width="1120" height="200" rx="12" fill="#ffffff" stroke="#cdebdf"/>
  <text x="96" y="490" class="grupo">DATOS</text>

  <g>
    <rect x="110" y="498" width="460" height="104" rx="9" fill="#e9f7f1" stroke="#0f8a5f"/>
    <text x="126" y="522" class="t">Almacén analítico</text>
    <text x="126" y="542" class="s">Redshift, o PostgreSQL equivalente en local</text>
    <text x="126" y="560" class="s">usuario de solo lectura · statement_timeout</text>
    <text x="126" y="578" class="s">search_path acotado al esquema del catálogo</text>
    <text x="126" y="596" class="s">16–24 ms por consulta</text>
  </g>

  <g>
    <rect x="710" y="498" width="460" height="104" rx="9" fill="#e9f7f1" stroke="#0f8a5f"/>
    <text x="726" y="522" class="t">DuckDB embebido</text>
    <text x="726" y="542" class="s">esquema cache + Parquet en disco</text>
    <text x="726" y="560" class="s">motor de transformación y caché</text>
    <text x="726" y="578" class="s">perfilado de claves entre tablas sin relación</text>
    <text x="726" y="596" class="s">~5 ms por consulta</text>
  </g>

  <path class="edgeN" d="M 574 542 L 706 542"/>
  <text x="640" y="534" class="lbl" text-anchor="middle">materializa</text>
  <path stroke="#9aa1ad" stroke-width="1.2" stroke-dasharray="4 3" fill="none" marker-end="url(#flecha)" d="M 706 578 L 574 578"/>
  <text x="640" y="596" class="lbl" text-anchor="middle">respaldo si el almacén falla</text>

  <g>
    <rect x="110" y="626" width="460" height="38" rx="8" fill="#fdf4e7" stroke="#b45309"/>
    <text x="126" y="650" class="t">warehouse-loader <tspan class="s">· DDL, COPY, índices y GRANT SELECT</tspan></text>
  </g>
  <g>
    <rect x="710" y="626" width="460" height="38" rx="8" fill="#fdf4e7" stroke="#b45309"/>
    <text x="726" y="650" class="t">pipeline/sync.py <tspan class="s">· incremental por marca de agua</tspan></text>
  </g>

  <path class="edgeN" d="M 340 624 L 340 606"/>
  <path class="edgeN" d="M 940 624 L 940 606"/>

  <!-- ============ Post-proceso ============ -->
  <path class="edge" d="M 340 670 L 560 706"/>
  <path class="edgeV" d="M 940 670 L 720 706"/>

  <rect x="80" y="712" width="1120" height="120" rx="12" fill="#ffffff" stroke="#c9d8fb"/>
  <text x="96" y="730" class="grupo">POST-PROCESO · PASOS 6 A 9</text>

  <g>
    <rect x="96" y="740" width="254" height="76" rx="9" fill="#eff4ff" stroke="#2563eb"/>
    <text x="110" y="762" class="num">6</text>
    <text x="126" y="762" class="t">Transformación</text>
    <text x="110" y="780" class="s">DuckDB sobre el resultado</text>
    <text x="110" y="796" class="s">LAG, SUM OVER, ranking</text>
  </g>
  <g>
    <rect x="374" y="740" width="254" height="76" rx="9" fill="#fdecec" stroke="#d33b3b"/>
    <text x="388" y="762" class="num" fill="#d33b3b">7</text>
    <text x="404" y="762" class="t">Enmascarado de PII</text>
    <text x="388" y="780" class="s">correos, documentos</text>
    <text x="388" y="796" class="s">y nombres completos</text>
  </g>
  <g>
    <rect x="652" y="740" width="254" height="76" rx="9" fill="#eff4ff" stroke="#2563eb"/>
    <text x="666" y="762" class="num">8</text>
    <text x="682" y="762" class="t">Visualización</text>
    <text x="666" y="780" class="s">elección automática</text>
    <text x="666" y="796" class="s">de gráfico e indicadores</text>
  </g>
  <g>
    <rect x="930" y="740" width="254" height="76" rx="9" fill="#eff4ff" stroke="#2563eb"/>
    <text x="944" y="762" class="num">9</text>
    <text x="960" y="762" class="t">Lenguaje de negocio</text>
    <text x="944" y="780" class="s">etiquetas, formatos</text>
    <text x="944" y="796" class="s">y resumen sin jerga</text>
  </g>

  <path class="edge" d="M 350 778 L 368 778"/>
  <path class="edge" d="M 628 778 L 646 778"/>
  <path class="edge" d="M 906 778 L 924 778"/>

  <path class="edge" d="M 640 832 L 640 862"/>

  <!-- ============ Respuesta ============ -->
  <rect x="400" y="866" width="480" height="56" rx="10" fill="#f7f8fa" stroke="#e6e8ec"/>
  <text x="420" y="890" class="t">Respuesta al usuario</text>
  <text x="420" y="908" class="s">texto, indicadores, gráfico, tabla, SQL y los 8 pasos con sus tiempos</text>

  <!-- Retorno al navegador -->
  <path class="edge" d="M 400 894 L 44 894 L 44 128 L 154 128"/>
  <text x="56" y="514" class="lbl" transform="rotate(-90 56 514)">~20 ms en total</text>

  <!-- ============ Leyenda ============ -->
  <rect x="80" y="948" width="1120" height="48" rx="10" fill="#ffffff" stroke="#e6e8ec"/>
  <rect x="100" y="965" width="14" height="14" rx="3" fill="#eff4ff" stroke="#2563eb"/>
  <text x="122" y="977" class="s">Agente y post-proceso</text>
  <rect x="290" y="965" width="14" height="14" rx="3" fill="#e9f7f1" stroke="#0f8a5f"/>
  <text x="312" y="977" class="s">Motores de datos</text>
  <rect x="460" y="965" width="14" height="14" rx="3" fill="#fdf4e7" stroke="#b45309"/>
  <text x="482" y="977" class="s">Procesos de datos</text>
  <rect x="640" y="965" width="14" height="14" rx="3" fill="#fdecec" stroke="#d33b3b"/>
  <text x="662" y="977" class="s">Control de seguridad</text>
  <text x="840" y="977" class="s">Primera materialización medida: 71 482 filas en 458 ms · 72 pruebas automatizadas</text>
</svg>
